name: Sync Resume to RAG

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsx scripts/sync-resume.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit updated experiences.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/experiences.json
          git diff --staged --quiet || git commit -m "chore: sync experiences.json"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/eshu3104/portfolio.git